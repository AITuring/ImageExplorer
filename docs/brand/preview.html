<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ImageExplorer · Logo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #e9eef4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #142a46; -webkit-font-smoothing: antialiased; }
    .board { width: 1200px; min-height: 820px; margin: auto; padding: 46px 64px 36px; background: #f4f7fa; }
    header { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; letter-spacing: 2.3px; color: #67778a; }
    .hero { display: flex; align-items: center; gap: 74px; padding: 46px 18px 54px; }
    .hero img { width: 358px; height: 358px; filter: drop-shadow(0 22px 23px #102d5a14); }
    .eyebrow { font-size: 13px; letter-spacing: 3px; color: #487d9e; margin-bottom: 21px; }
    h1 { margin: 0 0 17px; font-size: 54px; letter-spacing: -2.4px; font-weight: 650; line-height: 1.08; }
    .tagline { font-size: 18px; color: #576b81; letter-spacing: 4px; }
    .rule { width: 40px; height: 3px; margin: 30px 0 23px; background: #48bba9; border-radius: 2px; }
    .description { margin: 0; color: #718093; font-size: 14px; line-height: 1.9; }
    .panels { display: grid; grid-template-columns: 1.08fr 1fr .8fr; gap: 16px; }
    .panel { height: 181px; border-radius: 18px; padding: 21px 24px; background: white; border: 1px solid #e6ebf1; }
    .label { font-size: 10px; letter-spacing: 1.8px; font-weight: 600; color: #78879a; }
    .sizes { display: flex; gap: 24px; align-items: flex-end; height: 106px; }
    .sample { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .sample span { font-size: 10px; color: #8290a2; font-variant-numeric: tabular-nums; }
    .dark { background: #102338; border-color: #102338; color: white; }
    .dark .label { color: #a8bacd; }
    .dark-row { display: flex; gap: 16px; align-items: center; margin-top: 22px; }
    .dark-row img { width: 72px; height: 72px; }
    .dark-row strong { font-size: 17px; font-weight: 560; letter-spacing: -.4px; }
    .dark-row small { display: block; color: #a6bbcf; margin-top: 6px; font-size: 11px; }
    .mono-row { display: flex; align-items: center; gap: 24px; height: 111px; }
    .mono { display: block; width: 62px; height: 62px; background: #153865; mask: url('./logo-mono.svg') center / contain no-repeat; }
    .mono-inverse { background: #153865; border-radius: 13px; padding: 9px; }
    .mono-inverse .mono { width: 50px; height: 50px; background: #fff; }
    footer { display: flex; align-items: center; justify-content: space-between; margin-top: 29px; color: #8a96a4; font-size: 10px; letter-spacing: .7px; }
    .palette { display: flex; gap: 7px; align-items: center; }
    .swatch { width: 13px; height: 13px; border-radius: 50%; }
    .palette span:last-child { margin-left: 7px; }
    @media (max-width: 900px) { .board { width: 100%; padding: 30px; } .hero { flex-direction: column; gap: 25px; align-items: flex-start; } .hero img { width: 270px; height: 270px; align-self: center; } h1 { font-size: 42px; } .panels { grid-template-columns: 1fr; } footer { gap: 16px; flex-wrap: wrap; } }
  </style>
</head>
<body>
  <main class="board">
    <header><span>IMAGEEXPLORER</span><span>VISUAL IDENTITY · 01</span></header>
    <section class="hero" aria-label="Logo design">
      <img src="./logo.svg" alt="ImageExplorer：蓝色圆角底上的叠放照片与青绿山形">
      <div>
        <div class="eyebrow">叠景 · LAYERED VIEW</div>
        <h1>ImageExplorer</h1>
        <div class="tagline">浏览 · 挑片 · 整理</div>
        <div class="rule"></div>
        <p class="description">把照片收进画框，让视线向远处延伸。<br>叠放相片与清晰轮廓，为影像工作而设计。</p>
      </div>
    </section>
    <section class="panels" aria-label="Logo applications">
      <div class="panel">
        <div class="label">SMALL SIZES</div>
        <div class="sizes">
          <div class="sample"><img src="./logo-compact.svg" width="16" height="16" alt="16 px logo"><span>16</span></div>
          <div class="sample"><img src="./logo-compact.svg" width="24" height="24" alt="24 px logo"><span>24</span></div>
          <div class="sample"><img src="./logo-compact.svg" width="32" height="32" alt="32 px logo"><span>32</span></div>
          <div class="sample"><img src="./logo.svg" width="64" height="64" alt="64 px logo"><span>64</span></div>
        </div>
      </div>
      <div class="panel dark">
        <div class="label">DARK SURFACE</div>
        <div class="dark-row"><img src="./logo.svg" alt="Logo on dark background"><div><strong>ImageExplorer</strong><small>Browse. Select. Organize.</small></div></div>
      </div>
      <div class="panel">
        <div class="label">MONOCHROME</div>
        <div class="mono-row"><span class="mono" role="img" aria-label="深蓝单色标识"></span><span class="mono-inverse"><span class="mono" role="img" aria-label="白色单色标识"></span></span></div>
      </div>
    </section>
    <footer><div class="palette"><span class="swatch" style="background:#102D5A"></span><span class="swatch" style="background:#1755A5"></span><span class="swatch" style="background:#2998BB"></span><span class="swatch" style="background:#7CE0CB"></span><span>DEEP BLUE / JADE</span></div><span>SVG MASTER · OPTICAL SMALL SIZE · NATIVE APP ICONS</span></footer>
  </main>
</body>
</html>
